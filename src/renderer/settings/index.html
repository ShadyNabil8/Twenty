<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <title>twenty — Settings</title>
    <link rel="stylesheet" href="./settings.css" />
  </head>
  <body>
    <header>
      <h1>twenty</h1>
      <p>Every 20 minutes, look at something 20 feet away for 20 seconds.</p>
    </header>

    <form id="form">
      <section>
        <h2>Timer</h2>
        <div class="row">
          <label class="text" for="workMinutes">Work period</label>
          <span class="field">
            <input type="number" id="workMinutes" min="1" max="240" step="1" required />
            <span class="unit">min</span>
          </span>
        </div>
        <div class="row">
          <label class="text" for="breakSeconds">Break length</label>
          <span class="field">
            <input type="number" id="breakSeconds" min="5" max="600" step="5" required />
            <span class="unit">s</span>
          </span>
        </div>
        <label class="row">
          <span class="text">Allow skipping breaks with Esc</span>
          <input type="checkbox" id="skippable" class="toggle" />
        </label>
        <label class="row">
          <span class="text">
            Strict breaks
            <span class="desc">No way to end a break early, not even by holding Esc.</span>
          </span>
          <input type="checkbox" id="strictBreaks" class="toggle" />
        </label>
      </section>

      <section>
        <h2>Overlay</h2>
        <div class="row">
          <label class="text" for="overlayOpacity">Overlay opacity</label>
          <span class="field">
            <input type="range" id="overlayOpacity" min="30" max="100" step="1" />
            <span class="unit value" id="opacityValue">92%</span>
          </span>
        </div>
        <label class="row">
          <span class="text">Play a soft chime when the break starts</span>
          <input type="checkbox" id="soundEnabled" class="toggle" />
        </label>
        <div class="row stack">
          <label class="text" for="messages">
            Messages
            <span class="desc">One per line. A random one is shown on each break.</span>
          </label>
          <textarea id="messages" rows="7" spellcheck="false"></textarea>
        </div>
      </section>

      <section>
        <h2>Pre-break hint</h2>
        <label class="row">
          <span class="text">Show a small hint before the break</span>
          <input type="checkbox" id="hintEnabled" class="toggle" />
        </label>
        <div class="row">
          <label class="text" for="hintLeadSeconds">Show the hint this long before</label>
          <span class="field">
            <input type="number" id="hintLeadSeconds" min="5" max="300" step="5" required />
            <span class="unit">s</span>
          </span>
        </div>
      </section>

      <section>
        <h2>Activity</h2>
        <div class="row">
          <label class="text" for="idlePauseMinutes">
            Pause the timer after inactivity
            <span class="desc">The work period starts over when you're back.</span>
          </label>
          <span class="field">
            <input type="number" id="idlePauseMinutes" min="1" max="120" step="1" required />
            <span class="unit">min</span>
          </span>
        </div>
        <label class="row">
          <span class="text">Start twenty when I log in</span>
          <input type="checkbox" id="openAtLogin" class="toggle" />
        </label>
      </section>

      <footer>
        <div class="footnote">
          <p id="status" role="status"></p>
          <p class="note">Saving restarts the current work period.</p>
        </div>
        <div class="buttons">
          <button type="button" id="reset">Restore defaults</button>
          <button type="submit" id="save" class="primary">Save</button>
        </div>
      </footer>
    </form>

    <script type="module" src="./settings.ts"></script>
  </body>
</html>
