appId: com.shady.eye202020
productName: Eye 20-20-20
directories:
  output: release
  buildResources: build
files:
  - out/**
  - resources/**
  - package.json
# koffi is a native module (the .node binary lives in the per-platform
# @koromix/koffi-* packages); native modules must not load from inside the asar.
asarUnpack:
  - node_modules/koffi/**
  - node_modules/@koromix/**
win:
  target:
    - nsis
  icon: build/icon.png
nsis:
  oneClick: true
  deleteAppDataOnUninstall: false
mac:
  target:
    - dmg
  icon: build/icon.png
  category: public.app-category.healthcare-fitness
linux:
  target:
    - AppImage
    - deb
  icon: build/icon.png
  category: Utility
  synopsis: 20-20-20 eye-strain break enforcer
